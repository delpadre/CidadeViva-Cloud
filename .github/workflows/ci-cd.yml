name: CI-CD CitizenTech

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pytest pip-audit

      - name: Testes
        run: pytest -q

      - name: Auditoria de dependências (segurança)
        run: pip-audit -r requirements.txt

      - name: Empacotar artefato
        run: zip -r app.zip . -x ".git/*" ".github/*" "tests/*" "infra/*" "*.md"

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.zip

  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app

      - name: Deploy no Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: app.zip

      - name: Smoke test pós-deploy
        run: |
          sleep 45
          curl --fail --silent --show-error --retry 5 --retry-delay 10 "https://${{ secrets.AZURE_APP_NAME }}.azurewebsites.net/health"
